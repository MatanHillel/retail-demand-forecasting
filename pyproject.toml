[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail_demand_forecasting"
version = "0.1.0"
description = "Retail Demand Forecasting & Inventory Planning System (UCI Online Retail II) — PRD v1.3"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Daniel B. Fogel" },
    { name = "Matan Hillel" },
    { name = "Dor Hll" },
]
# Runtime dependencies are pinned in requirements.txt (PRD §43: versions pinned).
dependencies = []

[project.urls]
Specification = "docs/PRD.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# The EDA report template is a runtime asset, not documentation: without this it is missing from
# a non-editable install and eda_report.html cannot be rendered (US-11).
[tool.setuptools.package-data]
pipeline = ["eda/templates/*.j2"]
# Same reason: agents.yaml and tasks.yaml define the crew itself, so they are runtime assets and
# a non-editable install without them cannot build the Data Analyst Crew (US-12).
crews = ["data_analyst/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests, excluded with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline", "crews", "flow", "app"]
